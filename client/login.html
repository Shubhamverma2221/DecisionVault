<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to DecisionVault — Your Decisions Have a History. Track, review, and calibrate your cognitive choices.">
  <title>Login — DecisionVault</title>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheets (Light Mode Only) -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body style="background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">

  <div style="width: 100%; max-width: 440px;">
    
    <!-- Brand Logo -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/login.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
        <div class="brand-icon">DV</div>
        <span>DecisionVault</span>
      </a>
      <p style="font-size: 0.95rem; color: var(--text-muted);">Your Decisions Have a History</p>
    </div>

    <!-- Login Form Card -->
    <div class="form-card" style="padding: 2.25rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center;">Welcome Back</h1>
      <p style="font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 1.75rem;">
        Log in to evaluate your hypotheses and view your calibration history.
      </p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="you@company.com" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group" style="margin-bottom: 1.75rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn btn-primary" id="btn-login" style="width: 100%; padding: 0.75rem;">
          Log In
        </button>
      </form>

      <!-- Social & Guest Separator -->
      <div style="display: flex; align-items: center; margin: 1.75rem 0; color: var(--text-muted); font-size: 0.8rem;">
        <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
        <span style="padding: 0 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">or</span>
        <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
      </div>

      <!-- Continue with Google Button -->
      <button type="button" class="btn btn-secondary" id="btn-google-auth" style="width: 100%; margin-bottom: 0.75rem; padding: 0.65rem;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Continue as Guest Button -->
      <button type="button" class="btn btn-secondary" id="btn-guest-auth" style="width: 100%; border-style: dashed; background: #f8fafc; padding: 0.65rem;">
        <span>⚡ Continue as Guest (Instant Demo)</span>
      </button>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="font-weight: 600;">Create Account</a>
      </div>
    </div>

  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
